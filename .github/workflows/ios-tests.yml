name: iOS Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run XCTest suite on iOS Simulator
        run: |
          set -o pipefail
          SIM_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable == true and (.name | contains("iPhone"))) | .udid' | head -1)
          if [ -z "$SIM_UDID" ]; then
            echo "::error::No available iPhone simulator runtime found"
            exit 1
          fi
          echo "Testing on iOS Simulator UDID: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" >/dev/null 2>&1 || true
          if ! xcodebuild -project HandShare.xcodeproj -scheme HandShare -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO test > /tmp/xctest.log 2>&1; then
            tail -n 120 /tmp/xctest.log
            grep -E "error:|failed|Test Case.*failed|BUILD FAILED" /tmp/xctest.log | head -n 15 | while IFS= read -r l; do
              echo "::error::$l"
            done
            exit 65
          fi
          tail -n 45 /tmp/xctest.log
          grep -E "Test Case '.*' (passed|failed)|Executed [0-9]+ tests?" /tmp/xctest.log | tail -n 15 | while IFS= read -r l; do
            echo "::notice::$l"
          done
